global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'neuroride-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080']

  - job_name: 'neuroride-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8081', 'host.docker.internal:8081']