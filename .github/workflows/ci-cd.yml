name: NeuroRide CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile & Test Spring Boot
        working-directory: backend
        run: mvn -B verify

  test-ai-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck & Build AI Service
        working-directory: ai-service
        run: npm ci && npx tsc --noEmit && npm run build
      - name: Build Next.js Frontend
        working-directory: frontend
        run: npm ci && npm run build

  integration-and-k6-smoke:
    needs: [test-backend, test-ai-and-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot Full Stack via Docker Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
          echo "Waiting for Spring Boot actuator health..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then break; fi
            sleep 3
          done
      - name: Run k6 Smoke Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/neuroride-load.js
          flags: --vus 5 --duration 15s
      - name: Tear Down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration-and-k6-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}