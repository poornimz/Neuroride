name: NeuroRide CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile & Test Spring Boot
        working-directory: backend
        run: mvn -B verify

  test-ai-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck & Build AI Service
        working-directory: ai-service
        run: npm ci && npx tsc --noEmit && npm run build
      - name: Build Next.js Frontend
        working-directory: frontend
        run: npm ci && npm run build

  integration-and-k6-smoke:
    needs: [test-backend, test-ai-and-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot Full Stack via Docker Compose
        run: |
          [ -f .env ] || cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
          for i in {1..40}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.app.yml ps
          docker logs neuroride-backend --tail 60 || true
          exit 1
      - name: Run k6 Smoke Test
        run: |
          docker run --rm -i --network host \
            -e API_URL=http://localhost:8080/api/v1 \
            grafana/k6 run --vus 5 --duration 15s - < load-tests/neuroride-load.js
      - name: Tear Down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml down -v

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integration-and-k6-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository name for GHCR
        run: echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}